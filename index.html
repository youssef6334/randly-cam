<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Randly - شات فيديو ورسائل عشوائي</title>

<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

</head>

<body>



<!-- Landing Page -->

<div id="landingPage" class="landing-container">

<div class="landing-card">

<h1>Randly 🎲</h1>

<p>تحدث مع أناس عشوائيين حول العالم بكل أمان وسرعة!</p>


<div class="online-counter">

🔴 المتصلون الآن: <span id="landingOnlineCount">0</span>

</div>



<div class="interests-box">

<input type="text" id="interestsInput" placeholder="أدخل اهتماماتك (مثال: كرة قدم، برمجة)...">

</div>



<div class="start-buttons">

<button class="btn btn-primary-lg" onclick="startSession('video')">📹 شات فيديو</button>

<button class="btn btn-secondary-lg" onclick="startSession('text')">💬 شات كتابي</button>

</div>

</div>

</div>



<!-- App Container -->

<div class="main-container">



<!-- Top Header -->

<header class="app-header">

<div class="header-left">

<div class="logo">Randly</div>

<span class="user-display-name" id="userDisplayName">👤 زائر</span>

</div>


<div class="header-right">

<span class="online-badge">🟢 <span id="headerOnlineCount">0</span> online</span>

<button class="btn-icon" onclick="requestGame()">🎮</button>

<button class="btn-icon theme-toggle" onclick="toggleTheme()">🌙</button>

</div>

</header>



<!-- Top Adsterra Area (Native Banner) -->

<div class="top-ad-bar">

<script async="async" data-cfasync="false" src="https://pl30790391.effectivecpmnetwork.com/f66aa4bb4789b5ab486c7c42e435623d/invoke.js"></script>

<div id="container-f66aa4bb4789b5ab486c7c42e435623d"></div>

</div>



<!-- Main Viewport Content -->

<div class="content-wrapper">


<!-- Video Stage -->

<div id="videoSection" class="video-section">

<div class="video-box remote-box">

<video id="remoteVideo" autoplay playsinline></video>

<span class="video-label">الطرف الآخر</span>

</div>

<div class="video-box local-box">

<video id="localVideo" autoplay playsinline muted></video>

<span class="video-label">أنت</span>

</div>

</div>



<!-- Chat & Controls Area -->

<div id="chatSection" class="chat-section">


<div class="status-bar" id="status">متصل الآن!</div>


<div class="chat-box" id="chatBox">

<div class="msg msg-sys">مرحباً بك! انقر على Start لبدء الشات.</div>

</div>



<!-- Filters & Controls Bar -->

<div class="filter-controls-row">

<div class="select-wrapper">

<select id="countrySelect" class="filter-select">

<option value="global">🌐 Smart Match (عالمي)</option>



<!-- Top / Popular Countries -->

<option value="US">🇺🇸 United States</option>

<option value="GB">🇬🇧 United Kingdom</option>

<option value="CA">🇨🇦 Canada</option>

<option value="AU">🇦🇺 Australia</option>



<!-- ALL COUNTRIES (A-Z) -->

<option value="DZ">🇩🇿 Algeria</option>

<option value="AR">🇦🇷 Argentina</option>

<option value="BR">🇧🇷 Brazil</option>

<option value="EG">🇪🇬 Egypt</option>

<option value="FR">🇫🇷 France</option>

<option value="DE">🇩🇪 Germany</option>

<option value="IN">🇮🇳 India</option>

<option value="ID">🇮🇩 Indonesia</option>

<option value="IE">🇮🇪 Ireland</option>

<option value="IL">🇮🇱 Israel</option>

<option value="IT">🇮🇹 Italy</option>

<option value="MY">🇲🇾 Malaysia</option>

<option value="MX">🇲🇽 Mexico</option>

<option value="MA">🇲🇦 Morocco</option>

<option value="NL">🇳🇱 Netherlands</option>

<option value="NZ">🇳🇿 New Zealand</option>

<option value="NO">🇳🇴 Norway</option>

<option value="PK">🇵🇰 Pakistan</option>

<option value="PS">🇵🇸 Palestine</option>

<option value="PH">🇵🇭 Philippines</option>

<option value="PL">🇵🇱 Poland</option>

<option value="SA">🇸🇦 Saudi Arabia</option>

<option value="SG">🇸🇬 Singapore</option>

<option value="ZA">🇿🇦 South Africa</option>

<option value="ES">🇪🇸 Spain</option>

<option value="SE">🇸🇪 Sweden</option>

<option value="CH">🇨🇭 Switzerland</option>

<option value="TN">🇹🇳 Tunisia</option>

<option value="TR">🇹🇷 Turkey</option>

<option value="AE">🇦🇪 UAE</option>

</select>

</div>



<div class="quick-actions">

<button class="btn-action-icon" id="micBtn" onclick="toggleMic()" title="المايك">🎤</button>

<button class="btn-action-icon" id="camBtn" onclick="toggleCam()" title="الكاميرا">📹</button>

<button class="btn-action-icon" onclick="reportUser()" title="إبلاغ">⚠️</button>

<button class="btn-action-icon btn-close-chat" onclick="leaveSession()" title="خروج">❌</button>

</div>

</div>



<!-- Bottom Input & Big Start Button Row -->

<div class="bottom-action-bar">

<button class="btn-start-main" id="nextBtn" onclick="nextUser()">Start</button>


<div class="input-container">

<input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMsg()">

<button class="btn-send-inside" onclick="sendMsg()">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>

</button>

</div>

</div>



</div>

</div>

</div>



<!-- XO Mini-Game Overlay -->

<div id="gameBoardOverlay" class="game-overlay" style="display: none;">

<div class="game-card">

<div class="game-header">

<h3>لعبة XO 🎮</h3>

<button class="close-game" onclick="closeGame()">✕</button>

</div>

<p id="gameStatusText">جاري الانتظار...</p>

<div class="xo-grid">

<div class="xo-cell" onclick="makeMove(0)"></div>

<div class="xo-cell" onclick="makeMove(1)"></div>

<div class="xo-cell" onclick="makeMove(2)"></div>

<div class="xo-cell" onclick="makeMove(3)"></div>

<div class="xo-cell" onclick="makeMove(4)"></div>

<div class="xo-cell" onclick="makeMove(5)"></div>

<div class="xo-cell" onclick="makeMove(6)"></div>

<div class="xo-cell" onclick="makeMove(7)"></div>

<div class="xo-cell" onclick="makeMove(8)"></div>

</div>

</div>

</div>



<script src="script.js"></script>



<!-- Adsterra Social Bar Code -->

<script type="text/javascript" src="https://pl30790288.effectivecpmnetwork.com/af/01/4f/af014f7d78a0555fd804897f8175cc44.js"></script>

</body>

</html>
