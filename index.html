<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Randly - شات فيديو ورسائل عشوائي</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة الأيقونات الحديثة (FontAwesome) للزراير -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <!-- مكتبات تأثيرات الوجه (MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Landing Page -->
    <div id="landingPage" class="landing-container">
        <div class="landing-card">
            <h1>Randly 🎲</h1>
            <p>تحدث مع أناس عشوائيين حول العالم بكل أمان وسرعة!</p>
            
            <div class="online-counter">
                🔴 المتصلون الآن: <span id="landingOnlineCount">0</span>
            </div>

            <div class="interests-box">
                <!-- حقل الاهتمامات -->
                <input type="text" id="interestsInput" placeholder="أدخل اهتماماتك (مثال: كرة قدم، برمجة)...">
            </div>

            <div class="start-buttons">
                <button class="btn btn-primary-lg" onclick="startSession('video')"><i class="fas fa-video"></i> شات فيديو</button>
                <button class="btn btn-secondary-lg" onclick="startSession('text')"><i class="fas fa-comment-dots"></i> شات كتابي</button>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div class="main-container">

        <!-- Top Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">Randly</div>
                <span class="user-display-name" id="userDisplayName"><i class="fas fa-user"></i> زائر</span>
            </div>
            
            <div class="header-right">
                <span class="online-badge">🟢 <span id="headerOnlineCount">0</span> online</span>
                <button class="btn-icon" onclick="requestGame()">🎮</button>
                <button class="btn-icon theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </header>

        <!-- Top Adsterra Area -->
        <div class="top-ad-bar" id="adContainer">
            <div id="adContent">
                <script async="async" data-cfasync="false" src="https://pl30790391.effectivecpmnetwork.com/f66aa4bb4789b5ab486c7c42e435623d/invoke.js"></script>
                <div id="container-f66aa4bb4789b5ab486c7c42e435623d"></div>
            </div>
            <button class="toggle-ad-btn" onclick="toggleAd()">
                <span id="arrowIcon">▲</span>
            </button>
        </div>

        <!-- Main Viewport Content -->
        <div class="content-wrapper">
            
            <!-- Video Stage -->
            <div id="videoSection" class="video-section">
                <div class="video-box remote-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <span class="video-label">الطرف الآخر</span>
                </div>
                <div class="video-box local-box" style="position: relative;">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <!-- Canvas مخفي لرسم تأثيرات الوجه قبل الإرسال -->
                    <canvas id="maskCanvas" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; z-index: 2; pointer-events: none;"></canvas>
                    <span class="video-label" style="z-index: 3;">أنت</span>
                </div>
            </div>

            <!-- Chat & Controls Area -->
            <div id="chatSection" class="chat-section">
                
                <div class="status-bar" id="status">متصل الآن!</div>

                <!-- شاشة التحميل المخفية -->
                <div id="skeletonLoader" style="display: none; text-align: center; padding: 20px; color: #888; font-weight: bold;">
                    ⏳ جاري البحث عن شخص عشوائي...
                </div>
                
                <div class="chat-box" id="chatBox">
                    <div class="msg msg-sys">مرحباً بك! انقر على Start لبدء الشات.</div>
                </div>
                
                <!-- مؤشر الكتابة المخفي -->
                <div id="typingIndicator" style="display: none; font-size: 12px; color: #888; padding: 0 10px 10px 10px;">
                    الطرف الآخر يكتب الآن...
                </div>

                <!-- Filters & Controls Bar -->
                <div class="filter-controls-row">
                    <div class="select-wrapper">
                        <!-- قائمة الأعلام (تم إضافة فلسطين وإزالة أي أعلام غير مرغوب فيها) -->
                        <select id="countrySelect" class="filter-select">
                            <option value="global">🌐 عالمي (Smart Match)</option>
                            <option value="PS">🇵🇸 فلسطين</option>
                            <option value="EG">🇪🇬 مصر</option>
                            <option value="SA">🇸🇦 السعودية</option>
                            <option value="AE">🇦🇪 الإمارات</option>
                            <option value="MA">🇲🇦 المغرب</option>
                            <option value="DZ">🇩🇿 الجزائر</option>
                            <option value="KW">🇰🇼 الكويت</option>
                            <option value="US">🇺🇸 الولايات المتحدة</option>
                            <option value="GB">🇬🇧 بريطانيا</option>
                            <option value="FR">🇫🇷 فرنسا</option>
                            <option value="DE">🇩🇪 ألمانيا</option>
                            <option value="TR">🇹🇷 تركيا</option>
                            <option value="IN">🇮🇳 الهند</option>
                        </select>
                    </div>

                    <!-- قائمة لغة الترجمة الفورية الجديدة -->
                    <div class="select-wrapper">
                        <select id="translationLang" class="filter-select" title="لغة الترجمة في الشات">
                            <option value="none">بدون ترجمة</option>
                            <option value="ar">ترجمة لـ: العربية</option>
                            <option value="en">ترجمة لـ: الإنجليزية</option>
                            <option value="fr">ترجمة لـ: الفرنسية</option>
                            <option value="es">ترجمة لـ: الإسبانية</option>
                        </select>
                    </div>

                    <!-- زراير التحكم الحديثة -->
                    <div class="quick-actions">
                        <button class="btn-action-icon modern-btn" id="micBtn" onclick="toggleMic()" title="المايك">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="btn-action-icon modern-btn" id="camBtn" onclick="toggleCam()" title="الكاميرا">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="btn-action-icon modern-btn" id="maskBtn" onclick="toggleMask()" title="تأثيرات الوجه">
                            <i class="fas fa-masks-theater"></i>
                        </button>
                        <button class="btn-action-icon modern-btn" id="muteBtn" onclick="toggleSoundMute()" title="الصوت">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <button class="btn-action-icon modern-btn" id="copyLinkBtn" onclick="saveRoomLink()" title="نسخ رابط الغرفة">
                            <i class="fas fa-link"></i>
                        </button>
                        <button class="btn-action-icon modern-btn" onclick="reportUser()" title="إبلاغ">
                            <i class="fas fa-flag"></i>
                        </button>
                        <button class="btn-action-icon modern-btn btn-close-chat" onclick="leaveSession()" title="خروج">
                            <i class="fas fa-phone-slash"></i>
                        </button>
                    </div>
                </div>

                <!-- Bottom Action Bar -->
                <div class="bottom-action-bar">
                    <button class="btn-start-main" id="nextBtn" onclick="handleMainButton()">
                        <i class="fas fa-forward"></i> تخطي / Start
                    </button>
                    
                    <div class="input-container">
                        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMsg()">
                        <button class="btn-send-inside" onclick="sendMsg()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- XO Mini-Game Overlay -->
    <div id="gameBoardOverlay" class="game-overlay" style="display: none;">
        <div class="game-card">
            <div class="game-header">
                <h3>لعبة XO 🎮</h3>
                <button class="close-game" onclick="closeGame()">✕</button>
            </div>
            <p id="gameStatusText">دورك الآن</p>
            <div class="xo-grid">
                <div class="xo-cell" onclick="makeMove(0)"></div>
                <div class="xo-cell" onclick="makeMove(1)"></div>
                <div class="xo-cell" onclick="makeMove(2)"></div>
                <div class="xo-cell" onclick="makeMove(3)"></div>
                <div class="xo-cell" onclick="makeMove(4)"></div>
                <div class="xo-cell" onclick="makeMove(5)"></div>
                <div class="xo-cell" onclick="makeMove(6)"></div>
                <div class="xo-cell" onclick="makeMove(7)"></div>
                <div class="xo-cell" onclick="makeMove(8)"></div>
            </div>
        </div>
    </div> 
    
    <script src="script.js"></script>
    <script type="text/javascript" src="https://pl30790288.effectivecpmnetwork.com/af/01/4f/af014f7d78a0555fd804897f8175cc44.js"></script>
</body>
</html>
