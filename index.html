<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randly - شات فيديو عشوا بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- TensorFlow & NSFWJS CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="app-header">
        <div class="logo-area">
            <h1>Randly</h1>
            <span class="online-badge">🟢 المتصلون: <strong id="headerOnlineCount">0</strong></span>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="requestGame()">🎮 لعب XO</button>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">

        <!-- Landing Screen -->
        <div id="landingPage" class="landing-card">
            <h2>مرحباً بك في Randly 👋</h2>
            <p>تحدث مع أشخاص عشوائيين عبر الفيديو أو الشات الكتابي بآمان وسرعة.</p>
            
            <div class="input-group">
                <label for="interestsInput">الاهتمامات (اختياري):</label>
                <input type="text" id="interestsInput" placeholder="مثال: برمجة, أفلام, ألعاب">
            </div>

            <div class="landing-buttons">
                <button class="btn btn-primary btn-large" onclick="startSession('video')">📹 بدء شات فيديو</button>
                <button class="btn btn-secondary btn-large" onclick="startSession('text')">💬 بدء شات كتابي</button>
            </div>

            <div class="landing-stats">
                <span>🟢 متصل الآن: <strong id="landingOnlineCount">0</strong> مستخدم</span>
            </div>
        </div>

        <!-- App Layout (Video + Chat) -->
        <div class="app-content">

            <!-- Video Section -->
            <section id="videoSection" class="video-section">
                <div class="video-grid">
                    <div class="video-wrapper">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <span class="video-label">الطرف الآخر</span>
                    </div>
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted></video>
                        <span class="video-label">أنت</span>
                    </div>
                </div>

                <!-- Media Controls -->
                <div class="controls-bar">
                    <button id="micBtn" class="btn btn-icon" onclick="toggleMic()">🎤 المايك</button>
                    <button id="camBtn" class="btn btn-icon" onclick="toggleCam()">📹 الكاميرا</button>
                    <button id="screenBtn" class="btn btn-icon" onclick="toggleScreenShare()">🖥️ الشاشة</button>
                    <button class="btn btn-next" onclick="nextUser()">⏭️ التالي</button>
                    <button class="btn btn-danger" onclick="reportUser()">⚠️ إبلاغ</button>
                    <button class="btn btn-stop" onclick="leaveSession()">❌ خروج</button>
                </div>
            </section>

            <!-- Chat Section -->
            <section id="chatSection" class="chat-section">
                <div class="chat-header">
                    <span id="status">متوقف...</span>
                </div>

                <div id="chatBox" class="chat-box">
                    <div class="msg msg-sys">مرحباً بك! انقر على "التالي" لبدء الشات.</div>
                </div>

                <!-- Text-only control bar for text mode -->
                <div id="textOnlyControls" class="text-controls" style="display: none;">
                    <button class="btn btn-next" onclick="nextUser()">⏭️ شخص جديد</button>
                    <button class="btn btn-danger" onclick="reportUser()">⚠️ إبلاغ</button>
                    <button class="btn btn-stop" onclick="leaveSession()">❌ خروج</button>
                </div>

                <div class="chat-input-bar">
                    <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button class="btn btn-primary" onclick="sendMsg()">إرسال</button>
                </div>
            </section>

        </div>

    </main>

    <!-- XO Mini-Game Overlay -->
    <div id="gameBoardOverlay" class="game-overlay" style="display: none;">
        <div class="game-card">
            <h3>لعبة XO 🎮</h3>
            <p id="gameStatusText">جاري الانتظار...</p>
            <div class="xo-board">
                <button class="xo-cell" onclick="makeMove(0)"></button>
                <button class="xo-cell" onclick="makeMove(1)"></button>
                <button class="xo-cell" onclick="makeMove(2)"></button>
                <button class="xo-cell" onclick="makeMove(3)"></button>
                <button class="xo-cell" onclick="makeMove(4)"></button>
                <button class="xo-cell" onclick="makeMove(5)"></button>
                <button class="xo-cell" onclick="makeMove(6)"></button>
                <button class="xo-cell" onclick="makeMove(7)"></button>
                <button class="xo-cell" onclick="makeMove(8)"></button>
            </div>
            <button class="btn btn-secondary" onclick="closeGame()" style="margin-top: 15px;">إغلاق اللعبة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
