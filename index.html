<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Randly - Chat with Strangers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Landing Page (صفحة البداية) -->
    <div id="landingPage" class="landing-overlay">
        <div class="landing-card">
            <div class="landing-header">
                <span class="logo">Randly</span>
                <div class="header-right-landing">
                    <button class="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
                    <span class="online-badge"><span class="dot"></span> <span id="landingOnlineCount">1</span> أونلاين</span>
                </div>
            </div>
            
            <h1>التحدث مع غرباء</h1>
            <p>هل أنت مستعد للتعرف على شخص جديد؟ Randly يتيح لك الشات الكتابي أو الفيديو بكل سهولة وسرعة!</p>

            <div class="interests-box">
                <label>عن ماذا تريد أن تتحدث؟ (اختياري)</label>
                <input type="text" id="interestsInput" placeholder="أدخل اهتماماتك (مثال: ألعاب، موسيقى)...">
            </div>

            <div class="mode-buttons">
                <button class="btn btn-mode-text" onclick="startSession('text')">Text (شات كتابي)</button>
                <span class="or-text">أو</span>
                <button class="btn btn-mode-video" onclick="startSession('video')">Video (فيديو)</button>
            </div>
        </div>
    </div>

    <!-- Application Header -->
    <header>
        <div class="logo">Randly</div>
        <div id="status">جاري الاتصال بالسيرفر...</div>
        <div class="header-actions">
            <span class="online-badge header-online"><span class="dot"></span> <span id="headerOnlineCount">1</span> أونلاين</span>
            <button class="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
            <button class="btn btn-leave" onclick="leaveSession()">خروج 🚪</button>
        </div>
    </header>

    <div class="main-container">
        <div class="video-section" id="videoSection">
            <div class="videos">
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="label">الشخص الثاني</div>
                </div>
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="label">كاميرتك</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-next" onclick="nextUser()">التالي (Next) ⏭️</button>
                <button class="btn btn-control" id="camBtn" onclick="toggleCam()">📹 الكاميرا</button>
                <button class="btn btn-control" id="micBtn" onclick="toggleMic()">🎤 المايك</button>
                <button class="btn btn-control" id="screenBtn" onclick="toggleScreenShare()">🖥️ الشاشة</button>
            </div>
        </div>

        <div class="chat-section" id="chatSection">
            <div class="chat-header-tools">
                <button class="btn-tool btn-game" onclick="requestGame()">🎮 لعب XO</button>
                <button class="btn-tool btn-report" onclick="reportUser()">🚩 إبلاغ وحظر</button>
            </div>

            <!-- لوحة لعبة XO -->
            <div id="gameBoardOverlay" class="game-overlay" style="display: none;">
                <div class="game-header">
                    <span id="gameStatusText">لعبة XO</span>
                    <button class="close-game-btn" onclick="closeGame()">✕</button>
                </div>
                <div class="game-grid">
                    <button class="xo-cell" onclick="makeMove(0)"></button>
                    <button class="xo-cell" onclick="makeMove(1)"></button>
                    <button class="xo-cell" onclick="makeMove(2)"></button>
                    <button class="xo-cell" onclick="makeMove(3)"></button>
                    <button class="xo-cell" onclick="makeMove(4)"></button>
                    <button class="xo-cell" onclick="makeMove(5)"></button>
                    <button class="xo-cell" onclick="makeMove(6)"></button>
                    <button class="xo-cell" onclick="makeMove(7)"></button>
                    <button class="xo-cell" onclick="makeMove(8)"></button>
                </div>
            </div>

            <div id="chatBox">
                <div class="msg msg-sys">مرحباً بك! انقر على "التالي" لبدء الشات.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button class="btn btn-send" onclick="sendMsg()">إرسال</button>
            </div>
            <div class="text-only-controls" id="textOnlyControls" style="display: none; padding: 10px;">
                <button class="btn btn-next" style="width: 100%;" onclick="nextUser()">التالي (Next) ⏭️</button>
            </div>
        </div>
    </div>

    <!-- Ad Section -->
    <div class="ad-container">
        <script async="async" data-cfasync="false" src="https://pl30790391.effectivecpmnetwork.com/f66aa4bb4789b5ab486c7c42e435623d/invoke.js"></script>
        <div id="container-f66aa4bb4789b5ab486c7c42e435623d"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
    <script src="https://pl30790288.effectivecpmnetwork.com/af/01/4f/af014f7d78a0555fd804897f8175cc44.js"></script>
</body>
</html>
