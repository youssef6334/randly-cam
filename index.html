<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randly - Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- الهيدر -->
        <header class="app-header">
            <div class="logo-area">
                <h2>umingle</h2>
            </div>
            <div class="header-controls">
                <span id="headerOnlineCount">0</span> online
                <button id="darkModeToggle">🌙</button>
            </div>
        </header>

        <!-- نافذة المحادثة / الفيديو -->
        <div id="videoSection" class="video-section" style="display:none;">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="chat-container">
            <div id="chatBox" class="chat-box"></div>
        </div>

        <!-- منطقة الألعاب المصغرة X/O -->
        <div id="gameArea" class="game-area" style="display:none;">
            <h3>لعبة X/O</h3>
            <div class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <!-- شريط التحكم السفلي: الأزرار يمين/يسار معكوسة حسب الطلب -->
        <div class="bottom-control-bar">
            <!-- أزرار التحكم (Start / Skip / Really) في اليسار -->
            <div class="left-controls">
                <button id="actionBtn" class="control-btn start-state">Start</button>
                <button id="stopBtn" class="stop-btn">■</button>
            </div>

            <!-- زر وعندوق الإرسال في اليمين -->
            <div class="right-controls">
                <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                <button id="sendBtn" class="send-btn">➔</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
