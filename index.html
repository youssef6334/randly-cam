<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umingle Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Randly</div>
        <div id="status">جاري الاتصال بالسيرفر...</div>
    </header>

    <div class="main-container">
        <div class="video-section">
            <div class="videos">
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="label">كاميرتك</div>
                </div>
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="label">الشخص الثاني</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-control" id="micBtn" onclick="toggleMic()">🎤 المايك</button>
                <button class="btn btn-control" id="camBtn" onclick="toggleCam()">📹 الكاميرا</button>
                <button class="btn btn-next" onclick="nextUser()">التالي (Next) ⏭️</button>
            </div>
        </div>

        <div class="chat-section">
            <div id="chatBox">
                <div class="msg msg-sys">مرحباً بك! انقر على "التالي" لبدء الشات.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button class="btn btn-send" onclick="sendMsg()">إرسال</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
